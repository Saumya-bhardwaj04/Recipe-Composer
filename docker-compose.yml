version: '3.8'

services:
  mongo:
    image: mongo:7
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

  server:
    build: ./server
    restart: always
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/recipe-composer
      - JWT_SECRET=change_me_in_production
      - NODE_ENV=production
      - CLIENT_ORIGIN=http://localhost:4173
    depends_on:
      - mongo

  client:
    build: ./client
    restart: always
    ports:
      - '4173:4173'
    depends_on:
      - server

volumes:
  mongo-data:
